# GATE-GENE documentation site.
#
# Jekyll + Just the Docs, matching the SAIGE-doc setup so the two sites are
# siblings and pages can be adapted between them.
#
# >>> BEFORE FIRST PUBLISH: set `url` and `baseurl` to match the organisation
# >>> that ends up owning this repository. Currently assumes
# >>> ZhouLabGenetics/GATE-GENE-doc, to sit beside the code. If the repo lands
# >>> in WeiZhouLab instead, change `url` to https://weizhoulab.github.io
# >>> and keep baseurl as /GATE-GENE-doc.
url: https://zhoulabgenetics.github.io
baseurl: /GATE-GENE-doc

title: GATE-GENE
description: Gene-based rare-variant association analysis for time-to-event phenotypes

remote_theme: just-the-docs/just-the-docs
permalink: pretty
exclude: [Gemfile, Gemfile.lock, vendor, _site, node_modules]

# Just the Docs renders `{: .warning }` / `{: .note }` as an unstyled blockquote
# unless the callout is declared here.
callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: red

search_enabled: true
search:
  heading_level: 2
  previews: 2
heading_anchors: true
color_scheme: light
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "GATE-GENE on GitHub":
    - "https://github.com/ZhouLabGenetics/GATE-GENE"
aux_links_new_tab: true

footer_content: >
  Developed in the <a href="https://github.com/ZhouLabGenetics">Zhou Lab</a>.
  Distributed under the GPL.

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# Jekyll does NOT read a theme's own _config.yml, so the layout has to be set
# here. Without this, pages whose front matter omits `layout` render as bare
# HTML with no navigation.
defaults:
  - scope:
      path: ""
    values:
      layout: default
